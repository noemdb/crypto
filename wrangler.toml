name = "crypto"
main = ".open-next/worker.js"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]

# Enable observability to get logs in the Cloudflare dashboard
[observability]
enabled = true

# The assets directory for OpenNext
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Fix for the WORKER_SELF_REFERENCE issue where it references 'aim-tmp' instead of 'crypto'
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "crypto"
