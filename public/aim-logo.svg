<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="arrow1" x1="10" y1="22" x2="54" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="arrow2" x1="10" y1="42" x2="54" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hexagon background -->
  <polygon
    points="32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5"
    fill="url(#bg)"
    stroke="#1e40af"
    stroke-width="1.5"
  />

  <!-- Top arrow: left→right (buy low) -->
  <g filter="url(#glow)">
    <line x1="13" y1="22" x2="47" y2="22" stroke="url(#arrow1)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- arrowhead right -->
    <polyline points="42,17 51,22 42,27" fill="none" stroke="url(#arrow1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Bottom arrow: right→left (sell high) -->
  <g filter="url(#glow)">
    <line x1="51" y1="42" x2="17" y2="42" stroke="url(#arrow2)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- arrowhead left -->
    <polyline points="22,37 13,42 22,47" fill="none" stroke="url(#arrow2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
